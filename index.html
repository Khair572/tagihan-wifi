<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notifikasi Tagihan WiFi</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0f1a" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0f1a;
    --surface:#121a2b;
    --surface-2:#0d1420;
    --border:#223049;
    --text:#eef2f7;
    --text-dim:#8b98ad;
    --accent:#2dd4bf;
    --accent-dim:rgba(45,212,191,.14);
    --warn:#fb923c;
    --warn-dim:rgba(251,146,60,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:
      radial-gradient(600px 340px at 50% -10%, rgba(45,212,191,.10), transparent 60%),
      var(--bg);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;color:var(--text);
  }
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:26px;padding:32px 26px;width:100%;max-width:400px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .signal-icon{display:flex;justify-content:center;margin-bottom:18px;}
  .signal-icon svg{width:52px;height:52px;}

  h1{font-size:20px;font-weight:800;text-align:center;letter-spacing:-.01em;}
  .sub{color:var(--text-dim);text-align:center;font-size:13.5px;margin:6px 0 4px 0;line-height:1.5;}
  .badge-row{display:flex;justify-content:center;margin-top:10px;}
  .badge{
    background:var(--accent-dim);color:var(--accent);padding:6px 14px;
    border-radius:30px;font-size:11.5px;font-weight:700;display:inline-flex;
    align-items:center;gap:6px;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  #enableNotifBtn{
    display:none;margin:16px auto 0 auto;background:var(--accent-dim);color:var(--accent);
    border:none;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  #enableNotifBtn:hover{background:rgba(45,212,191,.24);}

  .section-label{
    color:var(--text-dim);font-size:11.5px;font-weight:700;
    margin:22px 0 10px 0;padding-top:18px;border-top:1px solid var(--border);
  }
  #history-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .history-item{
    background:var(--surface-2);padding:11px 14px;border-radius:12px;
    font-size:13px;color:var(--text);border-left:3px solid var(--accent);
    display:flex;justify-content:space-between;gap:10px;line-height:1.4;
  }
  .history-item .t{color:var(--text-dim);font-size:11px;white-space:nowrap;}
  .empty-hist{text-align:center;color:var(--text-dim);padding:18px 0;font-size:13.5px;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  /* TOAST (POPUP) */
  #toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;width:92%;max-width:400px;pointer-events:none;}
  .toast{
    background:linear-gradient(150deg,#1a2740,#101a2e);
    color:var(--text);padding:22px 20px 18px 20px;border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.55);border-left:5px solid var(--warn);
    border:1px solid var(--border);
    transform:translateY(calc(-100% - 30px));opacity:0;
    transition:all .55s cubic-bezier(.22,1,.36,1);pointer-events:auto;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast .title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;}
  .toast .title span{background:var(--warn-dim);color:var(--warn);padding:2px 10px;border-radius:20px;font-size:11px;}
  .toast .msg{margin:12px 0 16px 0;font-size:14.5px;line-height:1.5;background:var(--surface-2);padding:12px 14px;border-radius:14px;}
  .toast .btn-bayar{
    background:var(--accent);color:#04211d;border:none;padding:13px 24px;
    border-radius:14px;font-weight:800;font-size:14.5px;cursor:pointer;width:100%;
    font-family:inherit;transition:.15s;
  }
  .toast .btn-bayar:active{transform:scale(.97);}
  .toast .time{font-size:10.5px;color:var(--text-dim);display:block;margin-top:12px;text-align:right;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<div class="card">
    <div class="signal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round">
        <path d="M2.5 9.5a15 15 0 0 1 19 0" opacity="0.35"/>
        <path d="M5.3 13a10.5 10.5 0 0 1 13.4 0"/>
        <path d="M8.3 16.3a6 6 0 0 1 7.4 0"/>
        <circle cx="12" cy="19.3" r="1.4" fill="#2dd4bf" stroke="none"/>
      </svg>
    </div>
    <h1>Menunggu tagihan</h1>
    <p class="sub">Notifikasi akan langsung muncul di sini saat tagihan baru dikirim.</p>
    <div class="badge-row"><span class="badge"><span class="dot"></span>Real-time</span></div>
    <button id="enableNotifBtn">Aktifkan notifikasi</button>

    <div class="section-label">Riwayat tagihan</div>
    <div id="history-list">
        <div class="empty-hist">Belum ada tagihan masuk</div>
    </div>
</div>

<!-- Toast Popup (Cadangan jika tidak pakai Sketchware) -->
<div id="toast-container">
    <div id="toast" class="toast">
        <div class="title">⚠️ Tagihan baru <span>NEW</span></div>
        <div class="msg" id="msg-text">Memuat pesan...</div>
        <button class="btn-bayar" id="bayarBtn" onclick="window.open('https://wa.me/6282145910911?text=Saya%20sudah%20membayar%20tagihan%20wifi','_blank')">Sudah bayar? Konfirmasi di sini</button>
        <span class="time" id="time-tag"></span>
    </div>
</div>

<script>
    // ========== KONFIGURASI SUPABASE ==========
    const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa';

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const toast = document.getElementById('toast');
    const msgText = document.getElementById('msg-text');
    const timeTag = document.getElementById('time-tag');
    const historyList = document.getElementById('history-list');
    let lastId = 0;

    // ===== FUNGSI PANGGIL NOTIFIKASI ANDROID (SKETCHWARE) =====
    function triggerAndroidNotification(title, message) {
        // Cek apakah jembatan Android tersedia (hanya ada di Sketchware WebView)
        if (window.Android && typeof window.Android.showNotification === 'function') {
            try {
                window.Android.showNotification(title, message);
                console.log('✅ Notifikasi Android terkirim');
                return true;
            } catch (e) {
                console.error('Gagal kirim ke Android:', e);
                return false;
            }
        } else {
            console.log('ℹ️ Tidak ada jembatan Android, pakai fallback web.');
            return false;
        }
    }

    // ===== PUSH NOTIFICATION SUNGGUHAN (BEKERJA WALAU APP DITUTUP TOTAL) =====
    const VAPID_PUBLIC_KEY = 'BHz8rKHTRc2uPZAZ5f5QA4s48DlRrNqXVd8l_ga7Xray8Kgt8VxjrVY_VhC2R0oa8aTyWfWanaW3payG067lQZc';
    const enableNotifBtn = document.getElementById('enableNotifBtn');

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = atob(base64);
        return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    function getDeviceId() {
        let id = localStorage.getItem('device_id');
        if (!id) {
            id = 'dev-' + Math.random().toString(36).slice(2) + Date.now();
            localStorage.setItem('device_id', id);
        }
        return id;
    }

    async function updateNotifButton() {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
            enableNotifBtn.style.display = 'none';
            return;
        }
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        enableNotifBtn.style.display = (sub || Notification.permission === 'denied') ? 'none' : 'block';
    }

    async function subscribeToPush() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            console.log('Push tidak didukung di browser ini.');
            return;
        }
        try {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') { await updateNotifButton(); return; }

            const reg = await navigator.serviceWorker.ready;
            let sub = await reg.pushManager.getSubscription();
            if (!sub) {
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });
            }

            // Simpan subscription ke Supabase supaya server bisa kirim push ke device ini
            await sbClient.from('push_subscriptions').upsert({
                device_id: getDeviceId(),
                subscription: sub.toJSON()
            }, { onConflict: 'device_id' });

            console.log('✅ Berhasil subscribe push notification');
        } catch (e) {
            console.error('Gagal subscribe push:', e);
        } finally {
            await updateNotifButton();
        }
    }

    enableNotifBtn.addEventListener('click', subscribeToPush);

    // Coba subscribe otomatis saat halaman dibuka
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(() => {
            if (Notification.permission === 'granted') {
                subscribeToPush();
            } else {
                updateNotifButton();
            }
        });
    }

    // ===== FUNGSI SISTEM NOTIFIKASI =====
    function playBeep() {
        try {
            const ctx = new(window.AudioContext || window.webkitAudioContext)();
            [880, 1100].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.value = 0.2;
                osc.start(ctx.currentTime + (i * 0.15));
                osc.stop(ctx.currentTime + (i * 0.15) + 0.2);
            });
        } catch (e) { console.log('Beep skipped'); }
    }

    function showToastWeb(message, time) {
        msgText.innerText = message;
        timeTag.innerText = 'Dikirim: ' + (time ? new Date(time).toLocaleTimeString('id-ID') : new Date().toLocaleTimeString('id-ID'));
        toast.classList.add('show');
        playBeep();
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 20000);
    }

    function addHistoryItem(msg, time) {
        const div = document.createElement('div');
        div.className = 'history-item';
        const t = time ? new Date(time).toLocaleTimeString('id-ID') : 'Sekarang';
        div.innerHTML = `<span>${msg}</span><span class="t">${t}</span>`;
        historyList.prepend(div);
        const placeholder = historyList.querySelector('.empty-hist');
        if (placeholder) placeholder.remove();
        while (historyList.children.length > 10) {
            historyList.removeChild(historyList.lastChild);
        }
    }

    // ===== FUNGSI UTAMA SAAT NOTIF MASUK (SAAT HALAMAN SEDANG DIBUKA) =====
    function handleNewNotification(message, createdAt) {
        // 1. Tambahkan ke riwayat
        addHistoryItem(message, createdAt);

        // 2. Coba kirim ke Notifikasi Android (Sketchware, kalau dibuka lewat WebView-nya)
        triggerAndroidNotification('📢 Tagihan WiFi', message);

        // 3. Tampilkan juga popup di dalam halaman (notifikasi status bar dikirim oleh server via Push API)
        showToastWeb(message, createdAt);
    }

    // ===== AMBIL DATA PERTAMA =====
    async function loadInitialData() {
        const { data: history, error } = await sbClient
            .from('notifications')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(10);

        if (history && history.length > 0) {
            historyList.innerHTML = '';
            history.forEach(item => {
                addHistoryItem(item.message, item.created_at);
            });
            const latest = history[0];
            lastId = latest.id;
            // Tampilkan notifikasi terbaru saat halaman dibuka (biar pengguna tahu)
            handleNewNotification(latest.message, latest.created_at);
        }
    }

    // ===== POLLING (FALLBACK) =====
    async function checkNewData() {
        try {
            const { data, error } = await sbClient
                .from('notifications')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(1);

            if (error) throw error;
            if (data && data.length > 0) {
                const latest = data[0];
                if (latest.id > lastId) {
                    lastId = latest.id;
                    handleNewNotification(latest.message, latest.created_at);
                }
            }
        } catch (e) {
            console.log('Polling error:', e);
        }
    }

    // ===== REALTIME + POLLING =====
    async function initRealtimeWithFallback() {
        await loadInitialData();

        sbClient
            .channel('custom-insert-channel')
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'notifications'
            }, (payload) => {
                const newData = payload.new;
                if (newData.id > lastId) {
                    lastId = newData.id;
                    handleNewNotification(newData.message, newData.created_at);
                }
            })
            .subscribe((status) => {
                console.log('Realtime status:', status);
            });

        setInterval(checkNewData, 3000);
    }

    // JALANKAN
    initRealtimeWithFallback();

    // ===== DAFTARKAN SERVICE WORKER (AGAR BISA DI-INSTALL SEBAGAI APK VIA CHROME) =====
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js');
        });
    }
</script>

</body>
</html>
