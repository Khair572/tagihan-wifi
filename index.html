<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>📶 Notifikasi Tagihan WiFi</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b1120; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #1a2332; border-radius: 32px; padding: 30px 24px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); border: 1px solid #2a3a4e; }
        .status-icon { text-align: center; font-size: 56px; margin-bottom: 10px; }
        h1 { color: #e2e8f0; font-size: 22px; text-align: center; font-weight: 600; }
        .sub { color: #94a3b8; text-align: center; font-size: 14px; margin: 6px 0 20px 0; }
        .badge { background: #2d3b4f; color: #60a5fa; padding: 8px 16px; border-radius: 40px; font-size: 12px; display: inline-block; margin-top: 4px; }

        /* TOAST (POPUP) DARI ATAS SEBAGAI CADANGAN */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 92%; max-width: 400px; pointer-events: none; }
        .toast {
            background: linear-gradient(145deg, #dc2626, #b91c1c);
            color: white;
            padding: 24px 20px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(220, 38, 38, 0.6);
            border-left: 6px solid #fbbf24;
            transform: translateY(calc(-100% - 30px));
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast .title { font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .toast .title span { background: #fbbf24; color: #000; padding: 0 10px; border-radius: 20px; font-size: 12px; }
        .toast .msg { margin: 12px 0 16px 0; font-size: 16px; line-height: 1.5; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 14px; }
        .toast .btn-bayar { background: #fbbf24; color: #000; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: 0.2s; }
        .toast .btn-bayar:active { transform: scale(0.96); }
        .toast .time { font-size: 11px; opacity: 0.7; display: block; margin-top: 12px; text-align: right; }
        #history-list { margin-top: 20px; border-top: 1px solid #2a3a4e; padding-top: 16px; max-height: 200px; overflow-y: auto; }
        .history-item { background: #111c2e; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; border-left: 3px solid #3b82f6; }
        .history-item small { color: #64748b; float: right; }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-icon">📡</div>
        <h1>Menunggu Tagihan</h1>
        <p class="sub">LEMBO ADE 🙏 <br> <span class="badge">🔔 Real-time</span></p>
        <div id="history-list">
            <div style="text-align:center;color:#475569;padding:20px 0;font-size:14px;">Belum ada tagihan masuk</div>
        </div>
    </div>

    <!-- Toast Popup (Cadangan jika tidak pakai Sketchware) -->
    <div id="toast-container">
        <div id="toast" class="toast">
            <div class="title">⚠️ TAGIHAN <span>NEW</span></div>
            <div class="msg" id="msg-text">Memuat pesan...</div>
            <button class="btn-bayar" id="bayarBtn" onclick="window.open('https://wa.me/6282145910911?text=Saya%20sudah%20membayar%20tagihan%20wifi','_blank')">📤 Tekan ini kalau sudah bayar</button>
            <span class="time" id="time-tag"></span>
        </div>
    </div>

    <script>
        // ========== KONFIGURASI SUPABASE ==========
        const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa';

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toast = document.getElementById('toast');
        const msgText = document.getElementById('msg-text');
        const timeTag = document.getElementById('time-tag');
        const historyList = document.getElementById('history-list');
        let lastId = 0;

        // ===== FUNGSI PANGGIL NOTIFIKASI ANDROID (SKETCHWARE) =====
        function triggerAndroidNotification(title, message) {
            // Cek apakah jembatan Android tersedia (hanya ada di Sketchware WebView)
            if (window.Android && typeof window.Android.showNotification === 'function') {
                try {
                    window.Android.showNotification(title, message);
                    console.log('✅ Notifikasi Android terkirim');
                    return true;
                } catch (e) {
                    console.error('Gagal kirim ke Android:', e);
                    return false;
                }
            } else {
                console.log('ℹ️ Tidak ada jembatan Android, pakai fallback web.');
                return false;
            }
        }

        // ===== FUNGSI SISTEM NOTIFIKASI =====
        function playBeep() {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                [880, 1100].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.start(ctx.currentTime + (i * 0.15));
                    osc.stop(ctx.currentTime + (i * 0.15) + 0.2);
                });
            } catch (e) { console.log('Beep skipped'); }
        }

        function showToastWeb(message, time) {
            msgText.innerText = message;
            timeTag.innerText = 'Dikirim: ' + (time ? new Date(time).toLocaleTimeString('id-ID') : new Date().toLocaleTimeString('id-ID'));
            toast.classList.add('show');
            playBeep();
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 20000);
        }

        function addHistoryItem(msg, time) {
            const div = document.createElement('div');
            div.className = 'history-item';
            const t = time ? new Date(time).toLocaleTimeString('id-ID') : 'Sekarang';
            div.innerHTML = `📢 ${msg} <small>${t}</small>`;
            historyList.prepend(div);
            const placeholder = historyList.querySelector('div[style]');
            if (placeholder) placeholder.remove();
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // ===== FUNGSI UTAMA SAAT NOTIF MASUK =====
        function handleNewNotification(message, createdAt) {
            // 1. Tambahkan ke riwayat
            addHistoryItem(message, createdAt);

            // 2. Coba kirim ke Notifikasi Android (Sketchware)
            const sentToAndroid = triggerAndroidNotification('📢 Tagihan WiFi', message);

            // 3. Jika Android tidak merespon (berarti ini bukan WebView Sketchware), pakai pop-up web
            if (!sentToAndroid) {
                showToastWeb(message, createdAt);
            } else {
                // Jika berhasil kirim ke Android, tetap tampilkan popup web sebentar (opsional)
                // Agar pengguna tahu ada notif jika sedang melihat layar.
                showToastWeb(message, createdAt);
            }
        }

        // ===== AMBIL DATA PERTAMA =====
        async function loadInitialData() {
            const { data: history, error } = await sbClient
                .from('notifications')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            if (history && history.length > 0) {
                historyList.innerHTML = '';
                history.forEach(item => {
                    addHistoryItem(item.message, item.created_at);
                });
                const latest = history[0];
                lastId = latest.id;
                // Tampilkan notifikasi terbaru saat halaman dibuka (biar pengguna tahu)
                handleNewNotification(latest.message, latest.created_at);
            }
        }

        // ===== POLLING (FALLBACK) =====
        async function checkNewData() {
            try {
                const { data, error } = await sbClient
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;
                if (data && data.length > 0) {
                    const latest = data[0];
                    if (latest.id > lastId) {
                        lastId = latest.id;
                        handleNewNotification(latest.message, latest.created_at);
                    }
                }
            } catch (e) {
                console.log('Polling error:', e);
            }
        }

        // ===== REALTIME + POLLING =====
        async function initRealtimeWithFallback() {
            await loadInitialData();

            sbClient
                .channel('custom-insert-channel')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'notifications'
                }, (payload) => {
                    const newData = payload.new;
                    if (newData.id > lastId) {
                        lastId = newData.id;
                        handleNewNotification(newData.message, newData.created_at);
                    }
                })
                .subscribe((status) => {
                    console.log('Realtime status:', status);
                });

            setInterval(checkNewData, 3000);
        }

        // JALANKAN
        initRealtimeWithFallback();

        // ===== DAFTARKAN SERVICE WORKER (AGAR BISA DI-INSTALL SEBAGAI APK VIA CHROME) =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>

</body>
</html>
