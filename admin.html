<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel Admin — Tagihan WiFi</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0f1a" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0f1a;
    --surface:#121a2b;
    --surface-2:#0d1420;
    --border:#223049;
    --text:#eef2f7;
    --text-dim:#8b98ad;
    --accent:#2dd4bf;
    --accent-dim:rgba(45,212,191,.14);
    --success:#34d399;
    --success-dim:rgba(52,211,153,.14);
    --warning:#fb923c;
    --warning-dim:rgba(251,146,60,.14);
    --danger:#f87171;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:
      radial-gradient(700px 380px at 85% -10%, rgba(45,212,191,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px 16px;
  }
  .wrap{width:100%;max-width:560px;}

  /* header */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page-head h1{font-size:22px;font-weight:800;letter-spacing:-0.01em;}
  .page-head p{color:var(--text-dim);font-size:13.5px;margin-top:4px;line-height:1.5;max-width:34ch;}
  .signal-dot{
    width:38px;height:38px;border-radius:50%;
    background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .signal-dot svg{width:18px;height:18px;}

  /* tabs */
  .tabs{
    display:flex;gap:4px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:20px;
  }
  .tab-btn{
    flex:1;background:transparent;border:none;color:var(--text-dim);
    font-family:inherit;font-size:13.5px;font-weight:700;
    padding:10px 8px;border-radius:10px;cursor:pointer;transition:.18s;
  }
  .tab-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.03) inset;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
  }
  .card + .card{margin-top:16px;}

  .info-box{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:18px;
  }
  .info-box .label{color:var(--text-dim);font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .link-copy{display:flex;gap:8px;}
  .link-copy input{
    flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:12.5px;font-family:inherit;min-width:0;
  }
  .btn-mini{
    background:var(--accent-dim);color:var(--accent);border:1px solid transparent;
    padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s;
  }
  .btn-mini:hover{background:rgba(45,212,191,.22);}

  label{display:block;color:var(--text);font-weight:700;font-size:13.5px;margin-bottom:8px;}
  textarea{
    width:100%;min-height:120px;padding:14px;border-radius:var(--radius-md);
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);
    font-size:15px;font-family:inherit;resize:vertical;transition:.15s;line-height:1.5;
  }
  textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-dim);}

  .btn-primary{
    width:100%;background:var(--accent);color:#04211d;border:none;
    padding:15px;border-radius:var(--radius-md);font-size:15px;font-weight:800;
    font-family:inherit;margin-top:14px;cursor:pointer;transition:.15s;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;transform:none;cursor:default;}

  #status{
    margin-top:12px;text-align:center;font-weight:700;font-size:13px;
    padding:11px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-dim);
  }
  #status.success{color:var(--success);background:var(--success-dim);}
  #status.error{color:var(--danger);background:rgba(248,113,113,.12);}

  .section-title{
    color:var(--text-dim);font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;
    margin:22px 0 12px 0;
  }
  .section-title .count{background:var(--surface-2);color:var(--text);padding:2px 9px;border-radius:20px;font-size:11.5px;}

  #admin-history-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
  .hist-row{
    background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 14px;
    border-left:3px solid var(--accent);font-size:13.5px;color:var(--text);
    display:flex;justify-content:space-between;gap:10px;animation:fadeIn .25s ease;
  }
  .hist-row .msg{word-break:break-word;flex:1;line-height:1.4;}
  .hist-row .time{color:var(--text-dim);font-size:11.5px;white-space:nowrap;}
  .empty-state{text-align:center;color:var(--text-dim);font-size:13.5px;padding:20px 0;}

  /* ==== TAB PELANGGAN ==== */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .stat{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px 12px;text-align:center;
  }
  .stat .num{font-size:22px;font-weight:800;line-height:1;}
  .stat .cap{font-size:11.5px;color:var(--text-dim);margin-top:5px;}
  .stat.lunas .num{color:var(--success);}
  .stat.belum .num{color:var(--warning);}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input{
    background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;
  }
  .add-row input[name="name"]{flex:1.4;min-width:0;}
  .add-row input[name="phone"]{flex:1;min-width:0;}
  .add-row input:focus{border-color:var(--accent);outline:none;}
  .add-btn{
    background:var(--accent);color:#04211d;border:none;border-radius:var(--radius-sm);
    padding:0 16px;font-weight:800;font-size:18px;cursor:pointer;font-family:inherit;
  }

  .search-input{
    width:100%;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;margin-bottom:14px;
  }
  .search-input:focus{border-color:var(--accent);outline:none;}

  #customer-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;}
  .cust-row{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
  }
  .cust-info{flex:1;min-width:0;}
  .cust-name{font-weight:700;font-size:14px;color:var(--text);}
  .cust-phone{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .status-toggle{
    border:none;font-family:inherit;font-weight:700;font-size:12px;
    padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .status-toggle.lunas{background:var(--success-dim);color:var(--success);}
  .status-toggle.belum{background:var(--warning-dim);color:var(--warning);}
  .del-btn{
    background:transparent;border:none;color:var(--text-dim);cursor:pointer;
    font-size:16px;padding:4px 6px;line-height:1;
  }
  .del-btn:hover{color:var(--danger);}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <div>
      <h1>Panel admin</h1>
      <p>Kirim pemberitahuan tagihan dan kelola status pembayaran pelanggan.</p>
    </div>
    <div class="signal-dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round">
        <path d="M5 12a10 10 0 0 1 14 0"/>
        <path d="M8.5 15.5a5 5 0 0 1 7 0"/>
        <circle cx="12" cy="19" r="1.4" fill="#2dd4bf" stroke="none"/>
      </svg>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="kirim">Kirim notifikasi</button>
    <button class="tab-btn" data-tab="pelanggan">Pelanggan</button>
  </div>

  <!-- ===== TAB: KIRIM NOTIFIKASI ===== -->
  <div class="tab-panel active" id="tab-kirim">
    <div class="card">
      <div class="info-box">
        <div class="label">Link untuk pelanggan</div>
        <div class="link-copy">
          <input type="text" id="userLink" value="Memuat link..." readonly>
          <button class="btn-mini" onclick="copyLink()">Salin</button>
        </div>
      </div>

      <label for="msg">Isi pemberitahuan tagihan</label>
      <textarea id="msg">Tagihan WiFi bulan ini sebesar Rp 40.000 telah jatuh tempo. Harap segera dibayar sebelum tanggal 5</textarea>

      <button id="sendBtn" class="btn-primary" onclick="sendNotif()">Kirim ke semua pelanggan</button>
      <div id="status">Siap mengirim</div>
    </div>

    <div class="section-title">Riwayat kiriman <span class="count" id="history-count">0</span></div>
    <div id="admin-history-list">
      <div class="empty-state">Belum ada kiriman</div>
    </div>
  </div>

  <!-- ===== TAB: PELANGGAN ===== -->
  <div class="tab-panel" id="tab-pelanggan">
    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="cap">Pelanggan</div></div>
      <div class="stat lunas"><div class="num" id="stat-lunas">0</div><div class="cap">Lunas</div></div>
      <div class="stat belum"><div class="num" id="stat-belum">0</div><div class="cap">Belum bayar</div></div>
    </div>

    <div class="card">
      <label>Tambah pelanggan</label>
      <div class="add-row">
        <input type="text" name="name" id="newCustName" placeholder="Nama pelanggan">
        <input type="text" name="phone" id="newCustPhone" placeholder="No. HP (opsional)">
        <button class="add-btn" onclick="addCustomer()" aria-label="Tambah pelanggan">+</button>
      </div>

      <input type="text" class="search-input" id="searchCust" placeholder="Cari nama pelanggan..." oninput="renderCustomers()">

      <div id="customer-list">
        <div class="empty-state">Belum ada pelanggan</div>
      </div>
    </div>
  </div>

</div>

<script>
  // ========================================================
  // GANTI DENGAN DATA SUPABASE KAMU
  // ========================================================
  const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa';
  // ========================================================

  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- Tab switching ---
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // --- Link pelanggan ---
  const basePath = window.location.pathname.replace(/\/admin\.html$/, '');
  document.getElementById('userLink').value = window.location.origin + basePath + '/index.html';

  function copyLink() {
    const input = document.getElementById('userLink');
    input.select();
    document.execCommand('copy');
    const btn = event.target;
    const orig = btn.innerText;
    btn.innerText = 'Tersalin';
    setTimeout(() => btn.innerText = orig, 1500);
  }

  // ===================== KIRIM NOTIFIKASI =====================
  function addAdminHistoryItem(message, time) {
    const list = document.getElementById('admin-history-list');
    const placeholder = list.querySelector('.empty-state');
    if (placeholder) placeholder.remove();

    const div = document.createElement('div');
    div.className = 'hist-row';
    const timeStr = new Date(time || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    div.innerHTML = `<span class="msg">${message}</span><span class="time">${timeStr}</span>`;
    list.prepend(div);

    const items = list.querySelectorAll('.hist-row');
    document.getElementById('history-count').innerText = items.length;
    while (items.length > 20 && list.lastChild !== div) {
      list.removeChild(list.lastChild);
    }
  }

  async function loadAdminHistory() {
    const list = document.getElementById('admin-history-list');
    try {
      const { data, error } = await sbClient.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);
      if (error) throw error;
      list.innerHTML = '';
      if (data && data.length > 0) {
        data.forEach(item => addAdminHistoryItem(item.message, item.created_at));
      } else {
        list.innerHTML = '<div class="empty-state">Belum ada kiriman</div>';
        document.getElementById('history-count').innerText = '0';
      }
    } catch (err) {
      console.error('Gagal memuat riwayat:', err);
      list.innerHTML = '<div class="empty-state" style="color:#f87171;">Gagal memuat riwayat</div>';
    }
  }

  async function sendNotif() {
    const msg = document.getElementById('msg').value.trim();
    if (!msg) { alert('Isi pesan tagihan terlebih dahulu'); return; }

    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.innerText = 'Mengirim...';
    status.innerText = 'Mengirim ke database...';
    status.className = '';

    try {
      const { data, error } = await sbClient.from('notifications').insert([{ message: msg }]).select();
      if (error) throw error;

      if (data && data.length > 0) addAdminHistoryItem(data[0].message, data[0].created_at);
      else addAdminHistoryItem(msg, new Date().toISOString());

      status.innerText = 'Notifikasi terkirim ke semua pelanggan';
      status.className = 'success';
    } catch (err) {
      status.innerText = 'Gagal: ' + err.message;
      status.className = 'error';
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Kirim ke semua pelanggan';
    }
  }

  // ===================== PELANGGAN =====================
  let customers = [];

  function computeStats() {
    document.getElementById('stat-total').innerText = customers.length;
    document.getElementById('stat-lunas').innerText = customers.filter(c => c.status === 'lunas').length;
    document.getElementById('stat-belum').innerText = customers.filter(c => c.status !== 'lunas').length;
  }

  function renderCustomers() {
    const list = document.getElementById('customer-list');
    const q = document.getElementById('searchCust').value.trim().toLowerCase();
    const filtered = q ? customers.filter(c => c.name.toLowerCase().includes(q)) : customers;

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">${customers.length === 0 ? 'Belum ada pelanggan' : 'Tidak ditemukan'}</div>`;
      return;
    }

    list.innerHTML = filtered.map(c => `
      <div class="cust-row">
        <div class="cust-info">
          <div class="cust-name">${escapeHtml(c.name)}</div>
          ${c.phone ? `<div class="cust-phone">${escapeHtml(c.phone)}</div>` : ''}
        </div>
        <button class="status-toggle ${c.status === 'lunas' ? 'lunas' : 'belum'}" onclick="toggleStatus(${c.id}, '${c.status}')">
          ${c.status === 'lunas' ? 'Lunas' : 'Belum bayar'}
        </button>
        <button class="del-btn" onclick="deleteCustomer(${c.id})" aria-label="Hapus pelanggan">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.innerText = str;
    return div.innerHTML;
  }

  async function loadCustomers() {
    try {
      const { data, error } = await sbClient.from('customers').select('*').order('name', { ascending: true });
      if (error) throw error;
      customers = data || [];
      computeStats();
      renderCustomers();
    } catch (err) {
      console.error('Gagal memuat pelanggan:', err);
      document.getElementById('customer-list').innerHTML = '<div class="empty-state" style="color:#f87171;">Gagal memuat data pelanggan</div>';
    }
  }

  async function addCustomer() {
    const nameInput = document.getElementById('newCustName');
    const phoneInput = document.getElementById('newCustPhone');
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    if (!name) { nameInput.focus(); return; }

    try {
      const { data, error } = await sbClient.from('customers').insert([{ name, phone: phone || null }]).select();
      if (error) throw error;
      customers.push(data[0]);
      customers.sort((a, b) => a.name.localeCompare(b.name));
      computeStats();
      renderCustomers();
      nameInput.value = '';
      phoneInput.value = '';
      nameInput.focus();
    } catch (err) {
      alert('Gagal menambah pelanggan: ' + err.message);
      console.error(err);
    }
  }

  async function toggleStatus(id, currentStatus) {
    const newStatus = currentStatus === 'lunas' ? 'belum_bayar' : 'lunas';
    const customer = customers.find(c => c.id === id);
    const prevStatus = customer.status;
    customer.status = newStatus; // optimistic update
    computeStats();
    renderCustomers();

    try {
      const { error } = await sbClient.from('customers').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
      if (error) throw error;
    } catch (err) {
      customer.status = prevStatus; // rollback
      computeStats();
      renderCustomers();
      alert('Gagal mengubah status: ' + err.message);
    }
  }

  async function deleteCustomer(id) {
    if (!confirm('Hapus pelanggan ini?')) return;
    const backup = customers;
    customers = customers.filter(c => c.id !== id);
    computeStats();
    renderCustomers();

    try {
      const { error } = await sbClient.from('customers').delete().eq('id', id);
      if (error) throw error;
    } catch (err) {
      customers = backup;
      computeStats();
      renderCustomers();
      alert('Gagal menghapus pelanggan: ' + err.message);
    }
  }

  // --- Jalankan ---
  loadAdminHistory();
  loadCustomers();
</script>
</body>
</html>
