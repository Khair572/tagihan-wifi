<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>👑 Admin Tagihan WiFi</title>
    <!-- MUAT LIBRARY DI AWAL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: #1a2332;
            border-radius: 32px;
            padding: 30px 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a3a4e;
        }
        h1 {
            color: #f8fafc;
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .info-box {
            background: #111c2e;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid #2a3a4e;
            margin-bottom: 24px;
        }
        .info-box strong {
            color: #60a5fa;
            word-break: break-all;
            font-size: 14px;
        }
        .info-box small {
            color: #64748b;
            display: block;
            margin-top: 4px;
        }
        label {
            color: #e2e8f0;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #2a3a4e;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            transition: 0.2s;
        }
        textarea:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
        }
        #status {
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            background: #111c2e;
            color: #94a3b8;
        }
        .success {
            color: #4ade80 !important;
            background: #0a2a1a !important;
        }
        .error {
            color: #f87171 !important;
            background: #2a0a0a !important;
        }
        .link-copy {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .link-copy input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #2a3a4e;
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
        }
        .link-copy button {
            background: #3b82f6;
            padding: 10px 18px;
            margin: 0;
            width: auto;
            font-size: 14px;
            box-shadow: none;
        }
        .preview-badge {
            background: #2d3b4f;
            color: #fbbf24;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            display: inline-block;
            margin-left: 10px;
        }

        /* --- RIWAYAT --- */
        .history-section {
            margin-top: 28px;
            border-top: 1px solid #2a3a4e;
            padding-top: 18px;
        }
        .history-section h3 {
            color: #94a3b8;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-section h3 span {
            background: #2d3b4f;
            color: #60a5fa;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
        }
        #admin-history-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #admin-history-list .empty-history {
            text-align: center;
            color: #475569;
            font-size: 14px;
            padding: 16px 0;
        }
        .history-item-admin {
            background: #111c2e;
            padding: 12px 16px;
            border-radius: 14px;
            border-left: 4px solid #3b82f6;
            font-size: 14px;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        .history-item-admin .msg-text {
            word-break: break-word;
            flex: 1;
        }
        .history-item-admin .msg-time {
            color: #64748b;
            font-size: 12px;
            white-space: nowrap;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* scrollbar kecil */
        #admin-history-list::-webkit-scrollbar {
            width: 4px;
        }
        #admin-history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #admin-history-list::-webkit-scrollbar-thumb {
            background: #2a3a4e;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📡 Kirim Tagihan <span class="preview-badge">⚡ REAL-TIME</span></h1>
        <p class="sub">Notifikasi akan langsung muncul di semua HP pengguna yang membuka link.</p>

        <div class="info-box">
            <strong>🔗 Link untuk Pengguna:</strong>
            <div class="link-copy">
                <input type="text" id="userLink" value="Memuat link..." readonly>
                <button onclick="copyLink()">📋 Salin</button>
            </div>
            <small>* Kirim link ini ke pelanggan via WhatsApp/Telegram.</small>
        </div>

        <label for="msg">✏️ Isi Pemberitahuan Tagihan:</label>
        <textarea id="msg">Tagihan WiFi bulan ini sebesar Rp 40.000 telah jatuh tempo. Harap segera dibayar sebelum tanggal 5</textarea>

        <button id="sendBtn" onclick="sendNotif()">📤 KIRIM KE SEMUA PELANGGAN</button>
        <div id="status">⏳ Siap mengirim...</div>

        <!-- ===== BAGIAN RIWAYAT ===== -->
        <div class="history-section">
            <h3>📜 Riwayat Kiriman <span id="history-count">0</span></h3>
            <div id="admin-history-list">
                <div class="empty-history">Belum ada kiriman</div>
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // 1. GANTI DENGAN DATA SUPABASE KAMU
        // ========================================================
        const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa';
        // ========================================================

        // Inisialisasi Supabase client
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Tampilkan link yang benar ---
        // Ambil path folder saat ini (misal: /tagihan-wifi/) agar link otomatis sesuai
        const basePath = window.location.pathname.replace(/\/admin\.html$/, '');
        document.getElementById('userLink').value = window.location.origin + basePath + '/index.html';

        function copyLink() {
            const input = document.getElementById('userLink');
            input.select();
            document.execCommand('copy');
            alert('✅ Link berhasil disalin!');
        }

        // --- Fungsi tambah item riwayat di admin ---
        function addAdminHistoryItem(message, time) {
            const list = document.getElementById('admin-history-list');
            // Hapus placeholder "Belum ada kiriman" jika ada
            const placeholder = list.querySelector('.empty-history');
            if (placeholder) placeholder.remove();

            const div = document.createElement('div');
            div.className = 'history-item-admin';

            const timeStr = time ? new Date(time).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) :
                new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            div.innerHTML = `
                <span class="msg-text">📢 ${message}</span>
                <span class="msg-time">${timeStr}</span>
            `;

            // Masukkan di paling atas (terbaru di atas)
            list.prepend(div);

            // Update counter
            const countSpan = document.getElementById('history-count');
            const items = list.querySelectorAll('.history-item-admin');
            countSpan.innerText = items.length;

            // Batasi maksimal 20 item biar tidak berat
            while (items.length > 20) {
                list.removeChild(list.lastChild);
            }
        }

        // --- Muat riwayat dari database (saat halaman admin dibuka) ---
        async function loadAdminHistory() {
            try {
                const { data, error } = await sbClient
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const list = document.getElementById('admin-history-list');
                // Bersihkan list (termasuk placeholder)
                list.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(item => {
                        addAdminHistoryItem(item.message, item.created_at);
                    });
                } else {
                    list.innerHTML = '<div class="empty-history">Belum ada kiriman</div>';
                    document.getElementById('history-count').innerText = '0';
                }
            } catch (err) {
                console.error('Gagal memuat riwayat:', err);
                // Jika error, tampilkan pesan di list
                const list = document.getElementById('admin-history-list');
                list.innerHTML = '<div class="empty-history" style="color:#f87171;">❌ Gagal memuat riwayat</div>';
            }
        }

        // --- Fungsi kirim notifikasi (di-upgrade agar langsung update riwayat) ---
        async function sendNotif() {
            const msg = document.getElementById('msg').value.trim();
            if (!msg) {
                alert('Isi pesan tagihan terlebih dahulu!');
                return;
            }

            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = '⏳ Mengirim...';
            status.innerText = '⏳ Mengirim ke database...';
            status.className = '';

            try {
                // Insert ke Supabase
                const { data, error } = await sbClient
                    .from('notifications')
                    .insert([{ message: msg }])
                    .select(); // ambil data yang baru masuk (dapat created_at)

                if (error) throw error;

                // Jika berhasil, tambahkan langsung ke riwayat admin (tanpa perlu refresh)
                if (data && data.length > 0) {
                    const newItem = data[0];
                    addAdminHistoryItem(newItem.message, newItem.created_at);
                } else {
                    // fallback jika select tidak berhasil (tapi insert sukses)
                    addAdminHistoryItem(msg, new Date().toISOString());
                }

                status.innerText = '✅ Notifikasi BERHASIL dikirim! Semua pelanggan langsung menerima.';
                status.className = 'success';

                // (Opsional) kosongkan textarea setelah kirim agar siap untuk pesan baru
                // document.getElementById('msg').value = '';

            } catch (err) {
                status.innerText = '❌ Gagal: ' + err.message;
                status.className = 'error';
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = '📤 KIRIM KE SEMUA PELANGGAN';
            }
        }

        // --- Saat halaman dimuat, langsung ambil riwayat ---
        loadAdminHistory();
    </script>

</body>
</html>
